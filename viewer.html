<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hwasa Transcripts — Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: #1a1a1a; text-decoration: none; }
    a:hover { color: #555; }

    .viewer-header {
      max-width: 740px;
      margin: 0 auto;
      padding: 40px 24px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .viewer-header .back-link {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid #ccc;
      padding: 6px 16px;
      border-radius: 2px;
      transition: background 0.15s, border-color 0.15s;
    }

    .viewer-header .back-link:hover {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .viewer-header .file-name {
      font-family: 'Source Serif 4', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: #555;
      word-break: break-all;
    }

    .viewer-content {
      max-width: 740px;
      margin: 0 auto;
      padding: 36px 24px 100px;
    }

    .viewer-error {
      max-width: 740px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
    }

    .viewer-error h2 {
      font-family: 'Source Serif 4', serif;
      font-weight: 600;
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    .viewer-error p {
      color: #777;
      font-size: 0.95rem;
    }

    /* ── Transcript line groups ─────────────── */
    .transcript-block {
      margin-bottom: 0;
    }

    .line-group {
      margin-bottom: 8px;
    }

    .line-group pre {
      font-family: 'Source Serif 4', serif;
      font-size: 1.05rem;
      line-height: 1.85;
      color: #1a1a1a;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: none;
      margin: 0;
      padding: 0;
    }

    .line-group pre strong {
      font-weight: 700;
      font-style: normal;
    }

    /* ── Grammar toggle button ─────────────── */
    .grammar-toggle {
      display: inline-block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #4a90b8;
      background: none;
      border: 1px solid #b8d4e3;
      border-radius: 2px;
      padding: 3px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      margin-left: 18px;
      margin-top: 2px;
      margin-bottom: 16px;
    }

    .grammar-toggle:hover {
      color: #2a6f96;
      border-color: #4a90b8;
    }

    .grammar-toggle.open {
      color: #2a6f96;
      border-color: #4a90b8;
      background: #eef5fa;
    }

    /* ── Grammar expanded panel ────────────── */
    .grammar-panel {
      display: none;
      margin: 4px 0 16px 18px;
      padding: 16px 20px;
      border-left: 2px solid #b8d4e3;
      background: #f5f9fc;
    }

    .grammar-panel.open {
      display: block;
    }

    .grammar-panel-section-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 10px;
      margin-top: 0;
    }

    .grammar-panel-section-title + .grammar-panel-section-title {
      margin-top: 20px;
    }

    /* ── NEW: Sentence-level meaning & tone ── */
    .grammar-sentence-meaning {
      font-family: 'Source Serif 4', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .grammar-sentence-tone {
      font-size: 0.82rem;
      color: #777;
      font-style: italic;
      margin-bottom: 16px;
    }

    /* ── Word cards ────────────────────────── */
    .word-card {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #efefef;
    }

    .word-card:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .word-card-term {
      font-family: 'Source Serif 4', serif;
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 2px;
    }

    .word-card-def {
      font-size: 0.88rem;
      color: #555;
      margin-bottom: 4px;
    }

    .word-card-row {
      font-size: 0.82rem;
      color: #777;
      line-height: 1.5;
    }

    .word-card-row span.label {
      font-weight: 500;
      color: #999;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      margin-right: 4px;
    }

    .word-card-notes {
      font-size: 0.82rem;
      color: #666;
      line-height: 1.55;
      margin-top: 6px;
      font-style: italic;
    }

    /* ── Grammar point cards ───────────────── */
    .gp-card {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #efefef;
    }

    .gp-card:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .gp-card-pattern {
      font-family: 'Source Serif 4', serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 2px;
    }

    .gp-card-meaning {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 3px;
    }

    .gp-card-meta {
      font-size: 0.78rem;
      color: #999;
    }

    .gp-card-meta span.level-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 1px 7px;
      border: 1px solid #d8d8d8;
      border-radius: 2px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* ── Collapse button at bottom of panel ── */
    .grammar-collapse-btn {
      display: block;
      margin: 16px auto 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #4a90b8;
      background: none;
      border: 1px solid #b8d4e3;
      border-radius: 2px;
      padding: 4px 14px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .grammar-collapse-btn:hover {
      color: #2a6f96;
      border-color: #4a90b8;
    }

    /* ── Navigation Pill ──────────────────────── */
    .nav-pill {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0;
      background: rgba(26, 26, 26, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 4px 6px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .nav-pill.visible {
      opacity: 1;
      visibility: visible;
    }

    .nav-pill button {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: #ccc;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 30px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }

    .nav-pill button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-pill button:disabled {
      color: #555;
      cursor: default;
      background: none;
    }

    .nav-pill .pill-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }




    /* ── Timestamp input ──────────────────────── */
    .ts-wrapper {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .ts-input-container {
      display: flex;
      align-items: center;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-width 0.25s ease, opacity 0.2s ease;
    }

    .ts-input-container.open {
      max-width: 140px;
      opacity: 1;
    }

    .ts-input {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      width: 60px;
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      outline: none;
      margin-left: 4px;
      line-height: 1;
    }

    .ts-input::placeholder {
      color: #777;
      font-size: 0.72rem;
    }

    .ts-input:focus {
      border-color: rgba(255, 255, 255, 0.4);
    }

    .ts-input.error {
      border-color: #e05050;
    }

    .ts-go-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: #ccc;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 4px;
      margin-left: 3px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }

    .ts-go-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }

    @media (max-width: 640px) {
      .viewer-header { padding: 28px 20px 16px; }
      .viewer-header .file-name { font-size: 0.95rem; }
      .viewer-content { padding: 28px 20px 100px; }

      .line-group pre { font-size: 0.98rem; line-height: 1.75; }

      .grammar-toggle { margin-left: 10px; margin-bottom: 14px; }
      .grammar-panel { margin-left: 10px; padding: 14px 16px; }

      .nav-pill {
        bottom: 14px;
        padding: 3px 4px;
      }
      .nav-pill button {
        padding: 10px 11px;
        font-size: 0.74rem;
      }
    }

/* ── Audio Player Panel ──────────────────── */
.audio-panel {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1100;
  background: rgba(26, 26, 26, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #ccc;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  padding: 12px 20px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
  transform: translateY(-100%);
  transition: transform 0.3s ease;
}

.audio-panel.open {
  transform: translateY(0);
}

.audio-panel-row {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 740px;
  margin: 0 auto;
}

.audio-panel-row + .audio-panel-row {
  margin-top: 8px;
}

.audio-play-btn {
  background: none;
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #ccc;
  font-size: 1rem;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: color 0.15s, border-color 0.15s;
}

.audio-play-btn:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.5);
}

.audio-seek {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.audio-seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ccc;
  cursor: pointer;
}

.audio-time {
  font-size: 0.75rem;
  color: #999;
  white-space: nowrap;
  min-width: 80px;
  text-align: right;
}

.audio-speed {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.72rem;
  background: rgba(255, 255, 255, 0.08);
  color: #ccc;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  padding: 4px 6px;
  cursor: pointer;
  outline: none;
}

.audio-speed option {
  background: #1a1a1a;
  color: #ccc;
}

.audio-start-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  color: #ccc;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  padding: 5px 10px;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
  white-space: nowrap;
}

.audio-start-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.15);
}

.audio-segment-ts {
  font-size: 0.72rem;
  color: #777;
  white-space: nowrap;
}

/* ── Deep link target (from search results: viewer.html?file=…&t=7:58) ── */
.line-group.deep-target {
  border-radius: 3px;
  animation: deepFlash 6s ease-in-out forwards;
}
/* Holds for ~2.5 seconds, then fades out completely */
@keyframes deepFlash {
  0%   { background-color: rgba(255, 233, 140, 0.85); box-shadow: -10px 0 0 0 rgba(242, 210, 75, 1); }
  40%  { background-color: rgba(255, 233, 140, 0.85); box-shadow: -10px 0 0 0 rgba(242, 210, 75, 1); }
  100% { background-color: rgba(255, 233, 140, 0);    box-shadow: -10px 0 0 0 rgba(242, 210, 75, 0); }
}

/* ── Karaoke highlighting ────────────────── */
.line-group.audio-active pre strong {
  background: rgba(74, 144, 184, 0.15);
  border-radius: 2px;
  transition: background 0.2s ease;
}

.line-group.audio-playing pre strong {
  background: rgba(74, 144, 184, 0.3);
}

/* ── Tap-to-play cursor hint on KO lines ── */
.line-group[data-audio-seconds] pre strong {
  cursor: pointer;
}


/* ── AI Summary (storybible) ─────────────── */
.storybible { max-width: 100%; }
.storybible .sb-para {
  font-family: 'Source Serif 4', serif;
  font-size: 1.05rem;
  line-height: 1.8;
  color: #1a1a1a;
  margin-bottom: 16px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.storybible .sb-heading {
  font-family: 'Source Serif 4', serif;
  font-weight: 600;
  color: #1a1a1a;
  margin: 26px 0 10px;
}
.storybible .sb-h1 { font-size: 1.5rem; }
.storybible .sb-h2 { font-size: 1.25rem; }
.storybible .sb-h3 { font-size: 1.05rem; color: #555; }

/* ── Quiz ────────────────────────────────── */
.quiz { max-width: 100%; }
.quiz .quiz-line {
  font-family: 'Source Serif 4', serif;
  font-size: 1.05rem;
  line-height: 1.8;
  color: #1a1a1a;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.quiz .quiz-question {
  font-weight: 700;
  margin-top: 8px;
}
.quiz .quiz-question:first-child {
  margin-top: 0;
}
.quiz .quiz-spacer {
  height: 12px;
}

/* ── Interactive quiz (quiz-ui.js) ─────────── */
.qz {
  --qz-ink: #1a1a1a;
  --qz-sub: #5f5f5f;
  --qz-muted: #767676;
  --qz-line: #e0e0e0;
  --qz-right: #2e6b46;
  --qz-right-bg: #edf6f0;
  --qz-right-ink: #2a603f;
  --qz-wrong: #b0521f;
  --qz-wrong-bg: #fdf1ea;
  --qz-wrong-ink: #9a4519;
  --qz-blue: #1f5576;
  display: flex;
  flex-direction: column;
  gap: 22px;
  color: var(--qz-ink);
}
.qz-status { color: var(--qz-muted); font-size: 0.95rem; }
.qz-kicker,
.qz-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--qz-muted);
}
.qz-kicker:empty { display: none; }
.qz-title {
  font-family: 'Source Serif 4', serif;
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.2;
  margin-top: -16px;
}
.qz-sub { font-size: 0.9rem; color: var(--qz-sub); margin-top: -14px; }
.qz-hint { font-size: 0.8rem; color: var(--qz-muted); }
.qz-link { font-size: 0.86rem; font-weight: 600; color: var(--qz-blue); }
.qz-link:hover { color: #163f58; }
.qz-textlink {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--qz-muted, #767676);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.qz-notice {
  padding: 12px 16px;
  border: 1px solid #e8d48a;
  background: #fffbea;
  color: #6b5a10;
  font-size: 0.86rem;
  border-radius: 2px;
}
.qz-notice ul { margin: 6px 0 0 18px; }

/* Buttons */
.qz-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid #ccc;
  border-radius: 2px;
  background: #fff;
  color: var(--qz-ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.qz-btn:hover { border-color: var(--qz-ink); color: var(--qz-ink); }
.qz-btn-dark { background: var(--qz-ink); border-color: var(--qz-ink); color: #fff; font-weight: 600; }
.qz-btn-dark:hover { background: #333; color: #fff; }
.qz-btn-big {
  min-height: 50px;
  width: 100%;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 0.86rem;
}
.qz-btn:disabled { opacity: 0.5; cursor: default; }
.qz-row { display: flex; gap: 8px; flex-wrap: wrap; }
.qz-row-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.qz-btn:focus-visible, .qz-opt:focus-visible, .qz-pillbtn:focus-visible, .qz-play:focus-visible {
  outline: 2px solid var(--qz-blue);
  outline-offset: 2px;
}

/* Setup */
.qz-card {
  background: #fff;
  border: 1px solid var(--qz-line);
  border-radius: 3px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.qz-card-title { font-size: 0.86rem; font-weight: 600; }
.qz-card-text { font-size: 0.88rem; color: var(--qz-sub); }
.qz-group { display: flex; flex-direction: column; gap: 8px; }
.qz-check {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 14px;
  background: #fff;
  border: 1px solid var(--qz-line);
  border-radius: 2px;
  cursor: pointer;
}
.qz-check input { width: 18px; height: 18px; accent-color: var(--qz-ink); }
.qz-check-name { flex: 1; font-size: 0.95rem; }
.qz-check-count { font-size: 0.8rem; color: var(--qz-muted); }
.qz-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qz-pillbtn {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 500;
  min-height: 44px;
  border: 1px solid #ccc;
  border-radius: 999px;
  background: #fff;
  color: var(--qz-ink);
  cursor: pointer;
}
.qz-pillbtn:hover { border-color: var(--qz-ink); }
.qz-pillbtn.on { background: var(--qz-ink); border-color: var(--qz-ink); color: #fff; font-weight: 600; }
.qz-other { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qz-other[hidden] { display: none; }
.qz-other label { font-size: 0.88rem; color: #4a4a4a; }
.qz-other input {
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  width: 76px;
  min-height: 44px;
  padding: 0 10px;
  border: 1px solid var(--qz-ink);
  border-radius: 2px;
  background: #fff;
  color: var(--qz-ink);
}
.qz-switch { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; position: relative; }
.qz-switch input { position: absolute; opacity: 0; width: 44px; height: 26px; margin: 0; cursor: pointer; }
.qz-switch-track {
  flex-shrink: 0;
  width: 44px;

<body>

  <div class="viewer-header">
    <a href="index.html" class="back-link" id="backLink">← Back</a>
    <span class="file-name" id="fileName"></span>
  </div>

  <div class="viewer-content" id="viewerContent" style="display:none;">
    <div id="transcriptContainer"></div>
  </div>

  <div class="viewer-error" id="viewerError" style="display:none;">
    <h2>File not found</h2>
    <p>The requested file could not be loaded.</p>
    <p style="margin-top: 16px;">
      <a href="index.html" style="text-decoration: underline;">Return to index</a>
    </p>
  </div>

<!-- Audio Player Panel (hidden by default, toggled by JS) -->
<div class="audio-panel" id="audioPanel">
  <div class="audio-panel-row">
    <button class="audio-play-btn" id="audioPlayBtn">▶</button>
    <input type="range" class="audio-seek" id="audioSeek" min="0" max="100" value="0" step="0.1">
    <span class="audio-time" id="audioTime">0:00 / 0:00</span>
    <select class="audio-speed" id="audioSpeed">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
    </select>
  </div>
  <div class="audio-panel-row">
    <button class="audio-start-btn" id="audioStartBegin">▶ From beginning</button>
    <button class="audio-start-btn" id="audioStartSegment">▶ From current segment</button>
    <span class="audio-segment-ts" id="audioSegmentTs"></span>
  </div>
</div>

  
  <!-- Navigation Pill (hidden by default, built by JS) -->
  <div class="nav-pill" id="navPill"></div>

<!-- Interactive quiz (both files sit next to viewer.html) -->
<script src="quiz-core.js"></script>
<script src="quiz-ui.js"></script>

<script>
(function () {
  const params    = new URLSearchParams(window.location.search);
  const file      = params.get('file');
  const nameEl    = document.getElementById('fileName');
  const container = document.getElementById('transcriptContainer');
  const contentWrap = document.getElementById('viewerContent');
  const errorWrap   = document.getElementById('viewerError');
  const pill        = document.getElementById('navPill');
  
  // ── Audio: derive MP3 URL from transcript path and check if it exists ──
const R2_BASE = 'https://pub-ba1220e6945b499fa26ac869bef9e7f9.r2.dev'; // ← replace with your actual R2 URL
let audioUrl = null;
let audioReady = false;

(function checkAudio() {
  if (!file) return;
  if (/-storybible\.txt$/i.test(file)) return;
  if (/-quiz\d*\.txt$/i.test(file)) return;
  if (/-vocab\d*\.txt$/i.test(file)) return;   // vocab pages find their audio themselves
  const candidate = R2_BASE + '/' + file
    .replace('transcripts/', 'audio/')
    .replace('.txt', '.mp3')
    .replace(/\/hwasa-/, '/');
  fetch(candidate + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
    .then(r => {
      if (r.ok) {
        audioUrl = candidate;
        audioReady = true;
        console.log('Audio available:', audioUrl);
        const btn = document.getElementById('audioToggle');
        const sep = document.getElementById('audioSep');
        if (btn) btn.style.display = '';
        if (sep) sep.style.display = '';
        // If initAudioPlayer already ran and exited early, run it again now
        if (typeof window._audioPlayerInitialized === 'undefined') {
          initAudioPlayer();
        }
      }
     else {
        console.log('No audio found (status ' + r.status + ')');
      }
    })
    .catch(e => {
      console.log('Audio check failed:', e);
    });
})();


  initBackLink();

  /* ── Mixed quiz: viewer.html?mixed=<entry stem>&dir=<folder> ── */
  const mixedStem = params.get('mixed');
  if (!file && mixedStem && window.QuizUI) {
    document.title = 'Mixed quiz — Hwasa Transcripts';
    contentWrap.style.display = 'block';
    window.QuizUI.start({
      mode: 'mixed',
      stem: mixedStem,
      dir: params.get('dir') || '',
      container: container,
      pill: pill,
      nameEl: nameEl,
      r2Base: R2_BASE
    });
    return;
  }

  if (!file) {
    nameEl.textContent = 'No file specified';
    errorWrap.style.display = 'block';
    return;
  }

  const segments    = file.split('/');
  const displayName = segments[segments.length - 1];
  const isStorybible = /-storybible\.txt$/i.test(file);
  const isQuiz       = /-quiz\d*\.txt$/i.test(file);
  const isVocab      = /-vocab\d*\.txt$/i.test(file);
  nameEl.textContent = isStorybible ? 'AI Summary' : displayName;
  document.title    = (isStorybible ? 'AI Summary' : displayName) + ' — Hwasa Transcripts';

  /* ── Derive grammar file path from transcript path ── */
  const grammarFile = file.replace(/\.txt$/, '-grammar.txt');

  /* ── Fetch transcript, then optionally grammar ────── */
fetch(file)
  .then(r => {
    if (!r.ok) throw new Error('Not found');
    return r.text();
  })
  .then(text => {
    if (isStorybible) {
      contentWrap.style.display = 'block';
      renderStorybible(text);
      return;
    }
    if (isVocab && window.VocabUI) {
      contentWrap.style.display = 'block';
      if (window.VocabUI.start({
        file: file,
        text: text,
        container: container,
        pill: pill,
        nameEl: nameEl,
        r2Base: R2_BASE
      })) {
        return;
      }
      // No entries could be read: fall through to the plain display.
    }
    if (isQuiz) {
      contentWrap.style.display = 'block';
      const wantText = params.get('view') === 'text';
      if (!wantText && window.QuizUI && window.QuizUI.start({
        mode: 'file',
        file: file,
        text: text,
        container: container,
        pill: pill,
        nameEl: nameEl,
        r2Base: R2_BASE
      })) {
        return;
      }
      if (wantText) {
        const back = document.createElement('a');
        back.className = 'qz-textlink';
        back.href = 'viewer.html?file=' + encodeURIComponent(file);
        back.textContent = 'Interactive quiz';
        nameEl.parentElement.appendChild(back);
      }
      renderQuiz(text);
      return;
    }
    return fetch(grammarFile)
      .then(r => r.ok ? r.text() : null)
      .catch(() => null)
      .then(grammarText => {
        contentWrap.style.display = 'block';
        const grammarMap = grammarText ? parseGrammarFile(grammarText) : new Map();
        const blocks = parseBlocks(text);
        renderBlocks(blocks, grammarMap);
        initNavPill(blocks);
        initAudioPlayer();
        jumpToDeepLink();
      });
  })
  .catch(() => {
    errorWrap.style.display = 'block';
  });


  
  /* ══════════════════════════════════════════════════════
     GRAMMAR FILE PARSER  (UPDATED for new format)
     ══════════════════════════════════════════════════════ */
  function parseGrammarFile(text) {
    const map     = new Map();
    const entries = text.split(/^=== /m).filter(b => b.trim());

    for (const block of entries) {
      // NEW header format: [00:53] 뭘 왜야 ===
      const headerMatch = block.match(/^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*(.+?)\s*===$/m);
      if (!headerMatch) continue;

      const ts  = headerMatch[1].trim();
      const ko  = headerMatch[2].trim();
      const key = normTs(ts) + '\t' + normKo(ko);

      const entry = { meaning: '', tone: '', words: [], grammar: [] };

      // ── Extract sentence-level meaning and tone ──
      const meaningMatch = block.match(/^meaning:\s*(.+)/m);
      if (meaningMatch) entry.meaning = meaningMatch[1].trim();

      const toneMatch = block.match(/^tone:\s*(.+)/m);
      if (toneMatch) entry.tone = toneMatch[1].trim();

      // ── Split into sub-blocks ──
      const sections = block.split(/^--- /m);

      for (let i = 1; i < sections.length; i++) {
        const section   = sections[i];
        const typeMatch = section.match(/^(word|grammar)\s*---/);
        if (!typeMatch) continue;

        const type = typeMatch[1];
        const obj  = {};
        const lines = section.split('\n').slice(1);

        for (const line of lines) {
          // UPDATED: added "type" and "meaning" as recognized field names
          const m = line.match(/^(term|type|root|breakdown|pos|definition|meaning|notes|pattern|example|level):\s*(.*)/);
          if (m) obj[m[1]] = m[2].trim();
        }

        if (type === 'word' && obj.term) {
          entry.words.push(obj);
        } else if (type === 'grammar' && obj.pattern) {
          entry.grammar.push(obj);
        }
      }

      if (entry.words.length > 0 || entry.grammar.length > 0) {
        map.set(key, entry);
      }
    }

    return map;
  }

  /* ══════════════════════════════════════════════════════
     TRANSCRIPT PARSER  (unchanged)
     ══════════════════════════════════════════════════════ */
  function parseBlocks(text) {
    const lines  = text.split('\n');
    const blocks = [];
    let currentLines = [];
    let currentTS    = null;
    let currentSec   = 0;

    for (const line of lines) {
      const m = line.match(/^[—–─-]+\s*\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*[—–─-]+\s*$/);
      if (m) {
        if (currentLines.length > 0 || blocks.length === 0) {
          blocks.push({
            ts:      currentTS,
            seconds: currentSec,
            text:    currentLines.join('\n')
          });
        }
        currentTS   = m[1];
        currentSec  = tsToSeconds(m[1]);
        currentLines = [line];
      } else {
        currentLines.push(line);
      }
    }

    if (currentLines.length > 0) {
      blocks.push({
        ts:      currentTS,
        seconds: currentSec,
        text:    currentLines.join('\n')
      });
    }

    return blocks;
  }

  /* ══════════════════════════════════════════════════════
     RENDER BLOCKS WITH GRAMMAR SUPPORT  (unchanged)
     ══════════════════════════════════════════════════════ */
  function renderBlocks(blocks, grammarMap) {
    blocks.forEach((block, i) => {
      const section       = document.createElement('section');
      section.id          = `block-${i}`;
      section.dataset.seconds = block.seconds;
      section.className   = 'transcript-block';
      if (block.ts) section.dataset.timestamp = block.ts;

      const lineGroups = parseLineGroups(block.text);

      lineGroups.forEach(group => {
        const groupEl       = document.createElement('div');
        groupEl.className   = 'line-group';
        if (group.ts) {
          groupEl.dataset.audioSeconds = tsToSeconds(group.ts);
          groupEl.dataset.audioTs = group.ts;
        }


        const pre = document.createElement('pre');
        if (group.ts && group.ko) {
          const lines = group.raw.split('\n');
          lines.forEach((line, idx) => {
            const isLast = idx === lines.length - 1;
            const suffix = isLast ? '' : '\n';

            const tsLine = line.match(/^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*$/);
            const koLine = line.match(/^\s*KO:\s*.+/);

            if (tsLine || koLine) {
              const bold = document.createElement('strong');
              bold.textContent = line + suffix;
              pre.appendChild(bold);
            } else {
              pre.appendChild(document.createTextNode(line + suffix));
            }
          });
        } else {
          pre.textContent = group.raw;
        }
        groupEl.appendChild(pre);

        // Check if this group has grammar data
        if (group.ts && group.ko && grammarMap.size > 0) {
            const key = normTs(group.ts) + '\t' + normKo(group.ko);
            const entry = grammarMap.get(key);


          if (entry) {
            const toggleBtn       = document.createElement('button');
            toggleBtn.className   = 'grammar-toggle';
            toggleBtn.textContent = 'Grammar ▾';

            const panel       = document.createElement('div');
            panel.className   = 'grammar-panel';

            buildGrammarPanel(panel, entry);

            const collapseBtn       = document.createElement('button');
            collapseBtn.className   = 'grammar-collapse-btn';
            collapseBtn.textContent = '▲ Collapse';
            panel.appendChild(collapseBtn);

            function togglePanel() {
              const isOpen = panel.classList.toggle('open');
              toggleBtn.classList.toggle('open', isOpen);
              toggleBtn.textContent = isOpen ? 'Grammar ▴' : 'Grammar ▾';
            }

            toggleBtn.addEventListener('click', togglePanel);
            collapseBtn.addEventListener('click', () => {
              panel.classList.remove('open');
              toggleBtn.classList.remove('open');
              toggleBtn.textContent = 'Grammar ▾';
              toggleBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });

            groupEl.appendChild(toggleBtn);
            groupEl.appendChild(panel);
          }
        }

        section.appendChild(groupEl);
      });

      container.appendChild(section);
    });
  }

  /* ── Parse a block's text into line groups ── (unchanged) */
  function parseLineGroups(text) {
    const groups = [];
    const lines  = text.split('\n');
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];
      const tsMatch = line.match(/^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*$/);

      if (tsMatch) {
        const ts       = tsMatch[1];
        const rawLines = [line];
        let ko = null;
        let j  = i + 1;

        while (j < lines.length) {
          const nextLine = lines[j];
          if (nextLine.match(/^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*$/) ||
              nextLine.match(/^[—–─-]+\s*\[/)) {
            break;
          }
          rawLines.push(nextLine);
          const koMatch = nextLine.match(/^\s*KO:\s*(.+)/);
          if (koMatch) ko = koMatch[1].trim();
          j++;
        }

        groups.push({
          raw: rawLines.join('\n'),
          ts:  ts,
          ko:  ko
        });

        i = j;
      } else {
        groups.push({
          raw: line,
          ts:  null,
          ko:  null
        });
        i++;
      }
    }

    return groups;
  }

  /* ── Build the grammar panel content (UPDATED) ────── */
  function buildGrammarPanel(panel, entry) {

    // ── NEW: Sentence-level meaning and tone ──
    if (entry.meaning) {
      const meaningEl       = document.createElement('div');
      meaningEl.className   = 'grammar-sentence-meaning';
      meaningEl.textContent = entry.meaning;
      panel.appendChild(meaningEl);
    }

    if (entry.tone) {
      const toneEl       = document.createElement('div');
      toneEl.className   = 'grammar-sentence-tone';
      toneEl.textContent = entry.tone;
      panel.appendChild(toneEl);
    }

    // Words section
    if (entry.words.length > 0) {
      const title       = document.createElement('div');
      title.className   = 'grammar-panel-section-title';
      title.textContent = 'Words';
      panel.appendChild(title);

      entry.words.forEach(w => {
        const card       = document.createElement('div');
        card.className   = 'word-card';

        // Term
        const termEl       = document.createElement('div');
        termEl.className   = 'word-card-term';
        termEl.textContent = w.term || '';
        card.appendChild(termEl);

        // Meaning (new field, falls back to definition for backwards compat)
        const meaningText = w.meaning || w.definition;
        if (meaningText) {
          const defEl       = document.createElement('div');
          defEl.className   = 'word-card-def';
          defEl.textContent = meaningText;
          card.appendChild(defEl);
        }

        // Type (new field, falls back to pos for backwards compat)
        const typeText = w.type || w.pos;
        if (typeText) {
          const row       = document.createElement('div');
          row.className   = 'word-card-row';
          row.innerHTML   = '<span class="label">Type</span> ' + escapeHtml(typeText);
          card.appendChild(row);
        }

        // Root
        if (w.root) {
          const row       = document.createElement('div');
          row.className   = 'word-card-row';
          row.innerHTML   = '<span class="label">Root</span> ' + escapeHtml(w.root);
          card.appendChild(row);
        }

        // Breakdown
        if (w.breakdown) {
          const row       = document.createElement('div');
          row.className   = 'word-card-row';
          row.innerHTML   = '<span class="label">Breakdown</span> ' + escapeHtml(w.breakdown);
          card.appendChild(row);
        }

        // Notes
        if (w.notes) {
          const notesEl       = document.createElement('div');
          notesEl.className   = 'word-card-notes';
          notesEl.textContent = w.notes;
          card.appendChild(notesEl);
        }

        panel.appendChild(card);
      });
    }

    // Grammar points section (unchanged)
    if (entry.grammar.length > 0) {
      const title       = document.createElement('div');
      title.className   = 'grammar-panel-section-title';
      title.textContent = 'Grammar Points';
      panel.appendChild(title);

      entry.grammar.forEach(g => {
        const card       = document.createElement('div');
        card.className   = 'gp-card';

        const patternEl       = document.createElement('div');
        patternEl.className   = 'gp-card-pattern';
        patternEl.textContent = g.pattern || '';
        card.appendChild(patternEl);

        if (g.meaning) {
          const meaningEl       = document.createElement('div');
          meaningEl.className   = 'gp-card-meaning';
          meaningEl.textContent = g.meaning;
          card.appendChild(meaningEl);
        }

        const meta       = document.createElement('div');
        meta.className   = 'gp-card-meta';
        let metaHtml = '';
        if (g.example) {
          metaHtml += escapeHtml(g.example);
        }
        if (g.level) {
          metaHtml += '<span class="level-tag">' + escapeHtml(g.level) + '</span>';
        }
        if (metaHtml) {
          meta.innerHTML = metaHtml;
          card.appendChild(meta);
        }

        panel.appendChild(card);
      });
    }
  }

  /* ── HTML escape helper ────────────────── */
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ── AI Summary (storybible) renderer ──── */
function renderStorybible(text) {
  const wrap = document.createElement('div');
  wrap.className = 'storybible';
  const lines = text.split('\n');
  let para = [];
  const flush = () => {
    if (!para.length) return;
    const p = document.createElement('p');
    p.className = 'sb-para';
    p.textContent = para.join('\n');
    wrap.appendChild(p);
    para = [];
  };
  for (const line of lines) {
    const h = line.match(/^(#{1,3})\s+(.*)/);   // markdown-style headings
    if (h) {
      flush();
      const el = document.createElement('div');
      el.className = 'sb-heading sb-h' + h[1].length;
      el.textContent = h[2].trim();
      wrap.appendChild(el);
    } else if (line.trim() === '') {
      flush();
    } else {
      para.push(line);
    }
  }
  flush();
  container.appendChild(wrap);
}

  /* ── Quiz renderer ─────────────────────── */
function renderQuiz(text) {
  const wrap = document.createElement('div');
  wrap.className = 'quiz';
  const lines = text.split('\n');
  for (const line of lines) {
    const isQuestion = /^\s*(\*\*)?Q\d+[.)]/.test(line);   // "Q1.", "Q1)" or "**Q1.**"
    if (line.trim() === '') {
      const spacer = document.createElement('div');
      spacer.className = 'quiz-spacer';
      wrap.appendChild(spacer);
      continue;
    }
    const p = document.createElement('div');
    p.className = isQuestion ? 'quiz-line quiz-question' : 'quiz-line';
    p.textContent = line.replace(/\*\*/g, '');   // hide markdown bold markers
    wrap.appendChild(p);
  }
  container.appendChild(wrap);
}

  /* ══════════════════════════════════════════════════════
     NAVIGATION PILL (unchanged logic)
     ══════════════════════════════════════════════════════ */
  function initNavPill(blocks) {
    const hasSegments = blocks.length > 1 &&
      blocks.some(b => b.ts !== null);

    if (hasSegments) {
      buildFullPill(blocks);
    } else {
      buildTopOnlyPill();
    }

    pill.classList.add('visible');
  }

  function buildTopOnlyPill() {
    const btn = makeBtn('▲ Top', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    pill.appendChild(btn);
  }

  function buildFullPill(blocks) {
  let currentIndex = 0;
  const sectionEls = blocks.map((_, i) =>
    document.getElementById(`block-${i}`)
  );
  const prevBtn = makeBtn('◀ Prev', () => jumpTo(currentIndex - 1));
  const topBtn  = makeBtn('▲ Top', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  const nextBtn = makeBtn('Next ▶', () => jumpTo(currentIndex + 1));
  const tsBtn   = makeBtn('⏱', toggleTimestampInput);
  tsBtn.title   = 'Jump to timestamp';

  const tsWrapper   = document.createElement('div');
  tsWrapper.className = 'ts-wrapper';
  const tsContainer = document.createElement('div');
  tsContainer.className = 'ts-input-container';

  const tsInput     = document.createElement('input');
  tsInput.type      = 'text';
  tsInput.className = 'ts-input';
  tsInput.placeholder = 'mm:ss';
  tsInput.inputMode = 'numeric';
  const goBtn       = document.createElement('button');
  goBtn.className   = 'ts-go-btn';
  goBtn.textContent = 'Go';
  tsContainer.appendChild(tsInput);
  tsContainer.appendChild(goBtn);

  tsWrapper.appendChild(tsBtn);
  tsWrapper.appendChild(tsContainer);

  pill.appendChild(prevBtn);
  pill.appendChild(makeSep());
  pill.appendChild(topBtn);
  pill.appendChild(makeSep());
  pill.appendChild(nextBtn);
  pill.appendChild(makeSep());
  pill.appendChild(tsWrapper);

  // ── Audio toggle button (only visible when .mp3 exists) ──
  const audioSep = makeSep();
  audioSep.id = 'audioSep';
  audioSep.style.display = 'none';
  pill.appendChild(audioSep);

  const audioToggleBtn = document.createElement('button');
  audioToggleBtn.id = 'audioToggle';
  audioToggleBtn.title = 'Audio player';
  audioToggleBtn.className = 'pill-btn';
  audioToggleBtn.textContent = '🔊';
  audioToggleBtn.style.display = 'none';
  pill.appendChild(audioToggleBtn);

    // If HEAD check already completed before pill was built, show button now
  if (audioReady) {
    audioSep.style.display = '';
    audioToggleBtn.style.display = '';
  }

    
  // ── End audio toggle button ──

  function updateBtnStates() {
    prevBtn.disabled = currentIndex <= 0;
    nextBtn.disabled = currentIndex >= blocks.length - 1;
  }
  updateBtnStates();

  function jumpTo(idx) {
    idx = Math.max(0, Math.min(idx, blocks.length - 1));
    sectionEls[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        const idx = parseInt(id.split('-')[1], 10);
        currentIndex = idx;
        updateBtnStates();
      }
    }
  }, {
    rootMargin: '0px 0px -70% 0px',
    threshold: 0
  });
  sectionEls.forEach(el => { if (el) observer.observe(el); });

  let tsOpen = false;
  function toggleTimestampInput() {
    tsOpen = !tsOpen;
    tsContainer.classList.toggle('open', tsOpen);
    if (tsOpen) {
      tsInput.value = '';
      tsInput.classList.remove('error');
      requestAnimationFrame(() => tsInput.focus());
    }
  }

  function closeTimestampInput() {
    tsOpen = false;
    tsContainer.classList.remove('open');
    tsInput.value = '';
    tsInput.classList.remove('error');
  }

  function handleTimestampGo() {
    const raw = tsInput.value.trim();
    if (!raw) return;
    const targetSec = parseUserTime(raw);
    if (targetSec === null) {
      tsInput.classList.add('error');
      setTimeout(() => tsInput.classList.remove('error'), 800);
      return;
    }
    let bestIdx = 0;
    let bestDiff = Infinity;
    blocks.forEach((b, i) => {
      const diff = Math.abs(b.seconds - targetSec);
      if (diff < bestDiff) {
        bestDiff = diff;
        bestIdx = i;
      }
    });
    jumpTo(bestIdx);
    setTimeout(closeTimestampInput, 400);
  }

  goBtn.addEventListener('click', handleTimestampGo);
  tsInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleTimestampGo();
    if (e.key === 'Escape') closeTimestampInput();
  });
  document.addEventListener('click', (e) => {
    if (tsOpen && !pill.contains(e.target)) {
      closeTimestampInput();
    }
  });
}

/* ══════════════════════════════════════════════════════
   AUDIO PLAYER LOGIC
   ══════════════════════════════════════════════════════ */
function initAudioPlayer() {
  const panel     = document.getElementById('audioPanel');
  const playBtn   = document.getElementById('audioPlayBtn');
  const seekBar   = document.getElementById('audioSeek');
  const timeEl    = document.getElementById('audioTime');
  const speedSel  = document.getElementById('audioSpeed');
  const startBtn  = document.getElementById('audioStartBegin');
  const segBtn    = document.getElementById('audioStartSegment');
  const segTsEl   = document.getElementById('audioSegmentTs');
  const toggleBtn = document.getElementById('audioToggle');

  if (!audioReady || !audioUrl) return;
  window._audioPlayerInitialized = true;


  const audio = new Audio();
  audio.preload = 'metadata';
  audio.src = audioUrl;

  let panelOpen = false;
  let currentSegmentSeconds = 0;

  // ── Build sorted list of KO line-group cues ──
  const cues = [];
  document.querySelectorAll('.line-group[data-audio-seconds]').forEach(el => {
    cues.push({
      el: el,
      seconds: parseFloat(el.dataset.audioSeconds)
    });
  });
  cues.sort((a, b) => a.seconds - b.seconds);

  let activeCue = null;
  let sentenceEndTime = null;
  let sentenceMode = false;

  // ── Toggle panel open/close ──
  toggleBtn.addEventListener('click', () => {
    panelOpen = !panelOpen;
    panel.classList.toggle('open', panelOpen);
    // Pause audio when panel is closed
    if (!panelOpen && !audio.paused) {
      audio.pause();
    }
  });

  // ── Format seconds as m:ss ──
  function fmtTime(sec) {
    if (isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ── Find active cue for a given time ──
  function findCueAt(time) {
    let best = null;
    for (let i = 0; i < cues.length; i++) {
      if (cues[i].seconds <= time) {
        best = cues[i];
      } else {
        break;
      }
    }
    return best;
  }

  // ── Get the end time for a cue ──
  function getCueEndTime(cue) {
    for (let i = 0; i < cues.length; i++) {
      if (cues[i] === cue && i + 1 < cues.length) {
        return cues[i + 1].seconds;
      }
    }
    return audio.duration || Infinity;
  }

  // ── Auto-scroll to keep active cue visible ──
  function scrollToActiveCue(cueEl) {
    const rect = cueEl.getBoundingClientRect();
    const panelHeight = panelOpen ? panel.offsetHeight : 0;
    const viewTop = panelHeight + 20;
    const viewBottom = window.innerHeight - 100;

    if (rect.top < viewTop || rect.bottom > viewBottom) {
      const scrollTarget = window.scrollY + rect.top - viewTop - 40;
      window.scrollTo({ top: scrollTarget, behavior: 'smooth' });
    }
  }

  // ── Auto-collapse grammar panels in a line group ──
  function collapseGrammarPanels(cueEl) {
    const openPanels = cueEl.querySelectorAll('.grammar-panel.open');
    openPanels.forEach(p => {
      p.classList.remove('open');
      const btn = p.previousElementSibling;
      if (btn && btn.classList.contains('grammar-toggle')) {
        btn.classList.remove('open');
        btn.textContent = 'Grammar ▾';
      }
    });
  }

  // ── Clear all highlights ──
  function clearHighlight() {
    if (activeCue) {
      activeCue.el.classList.remove('audio-active', 'audio-playing');
      activeCue = null;
    }
  }

  // ── Highlight the active cue ──
  function updateHighlight(time) {
    const cue = findCueAt(time);
    if (cue === activeCue) return;

    const previousCue = activeCue;

    if (activeCue) {
      activeCue.el.classList.remove('audio-active', 'audio-playing');
    }

    activeCue = cue;

    if (activeCue) {
      activeCue.el.classList.add('audio-active');
      if (!audio.paused) {
        activeCue.el.classList.add('audio-playing');
        scrollToActiveCue(activeCue.el);
        if (previousCue) {
          collapseGrammarPanels(previousCue.el);
        }
      }
    }
  }

  // ── Play / Pause ──
  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      sentenceMode = false;
      sentenceEndTime = null;
      audio.play();
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', () => {
    playBtn.textContent = '⏸';
    if (activeCue) {
      activeCue.el.classList.add('audio-playing');
    }
  });

  audio.addEventListener('pause', () => {
    playBtn.textContent = '▶';
    if (activeCue) {
      activeCue.el.classList.remove('audio-playing');
    }
  });

  // ── Audio ended: clear everything ──
  audio.addEventListener('ended', () => {
    playBtn.textContent = '▶';
    sentenceMode = false;
    sentenceEndTime = null;
    clearHighlight();
  });

  // ── Seek bar updates ──
  audio.addEventListener('loadedmetadata', () => {
    seekBar.max = audio.duration;
    timeEl.textContent = fmtTime(0) + ' / ' + fmtTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    seekBar.value = audio.currentTime;
    timeEl.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
    updateHighlight(audio.currentTime);

    if (sentenceMode && sentenceEndTime !== null && audio.currentTime >= sentenceEndTime) {
      audio.pause();
      sentenceMode = false;
      sentenceEndTime = null;
    }
  });

  seekBar.addEventListener('input', () => {
    sentenceMode = false;
    sentenceEndTime = null;
    audio.currentTime = parseFloat(seekBar.value);
    updateHighlight(audio.currentTime);
  });

  // ── Speed selector ──
  speedSel.addEventListener('change', () => {
    audio.playbackRate = parseFloat(speedSel.value);
  });

  // ── Start from beginning ──
  startBtn.addEventListener('click', () => {
    sentenceMode = false;
    sentenceEndTime = null;
    audio.currentTime = 0;
    audio.play();
  });

  // ── Start from current segment ──
  segBtn.addEventListener('click', () => {
    sentenceMode = false;
    sentenceEndTime = null;
    audio.currentTime = currentSegmentSeconds;
    audio.play();
  });

  // ── Update current segment ──
  function setSegment(seconds, label) {
    currentSegmentSeconds = seconds;
    segTsEl.textContent = label ? ('Segment: ' + label) : '';
  }
  window.setAudioSegment = setSegment;
  setSegment(0, '0:00');
  // If the page was opened at a specific line (&t=…), start the segment there.
  if (window._pendingSegment) {
    setSegment(window._pendingSegment.seconds, window._pendingSegment.ts);
  }

  // ── Tap-to-play with long-press detection ──
  const TAP_THRESHOLD = 300; // ms — shorter = tap, longer = long-press

  cues.forEach((cue, i) => {
    let touchStartTime = 0;
    let touchMoved = false;

    // ── Touch events (mobile) ──
    cue.el.addEventListener('touchstart', (e) => {
      if (e.target.closest('.grammar-toggle') || e.target.closest('.grammar-panel') || e.target.closest('.grammar-collapse-btn')) {
        return;
      }
      touchStartTime = Date.now();
      touchMoved = false;
    }, { passive: true });

    cue.el.addEventListener('touchmove', () => {
      touchMoved = true;
    }, { passive: true });

    cue.el.addEventListener('touchend', (e) => {
      if (e.target.closest('.grammar-toggle') || e.target.closest('.grammar-panel') || e.target.closest('.grammar-collapse-btn')) {
        return;
      }
      if (touchMoved) return;

      const elapsed = Date.now() - touchStartTime;
      if (elapsed >= TAP_THRESHOLD) return; // long-press — let browser handle it

      e.preventDefault(); // prevent click from also firing
      playSentence(cue, i);
    });

    // ── Click event (desktop) ──
    cue.el.addEventListener('click', (e) => {
      if (e.target.closest('.grammar-toggle') || e.target.closest('.grammar-panel') || e.target.closest('.grammar-collapse-btn')) {
        return;
      }
      playSentence(cue, i);
    });
  });

  function playSentence(cue, i) {
    const startTime = cue.seconds;
    const endTime = (i + 1 < cues.length) ? cues[i + 1].seconds : (audio.duration || Infinity);

    setSegment(startTime, cue.el.dataset.audioTs);

    sentenceMode = true;
    sentenceEndTime = endTime;
    audio.currentTime = startTime;
    audio.play();
  }
}





  
  /* ══════════════════════════════════════════════════════
     DEEP LINK: viewer.html?file=…&t=7:58
     Scrolls to that line, flashes it, and sets it as the
     current audio segment. Used by search results.
     ══════════════════════════════════════════════════════ */
  function jumpToDeepLink() {
    const t = params.get('t');
    if (!t || !/^\d{1,2}(:\d{1,2}){1,2}$/.test(t.trim())) return;
    const want = normTs(t.trim());
    const wantSec = tsToSeconds(want);

    const groups = [...document.querySelectorAll('.line-group[data-audio-ts]')];
    if (!groups.length) return;

    // Exact timestamp first; otherwise the closest line before it.
    let target = groups.find(g => normTs(g.dataset.audioTs) === want);
    if (!target) {
      let best = null;
      groups.forEach(g => {
        const s = parseFloat(g.dataset.audioSeconds);
        if (s <= wantSec && (!best || s >= parseFloat(best.dataset.audioSeconds))) best = g;
      });
      target = best || groups[0];
    }

    target.classList.add('deep-target');
    target.addEventListener('animationend', () => target.classList.remove('deep-target'), { once: true });

    const seg = { seconds: parseFloat(target.dataset.audioSeconds), ts: target.dataset.audioTs };
    window._pendingSegment = seg;
    if (typeof window.setAudioSegment === 'function') window.setAudioSegment(seg.seconds, seg.ts);

    const scrollToTarget = () => target.scrollIntoView({ block: 'center' });
    requestAnimationFrame(scrollToTarget);
    // Fonts can shift the layout after they load; re-center once they're ready.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => requestAnimationFrame(scrollToTarget));
    }
  }

  /* ── Back button: return to the exact index view you came from
        (same search results, same scroll position) when possible ── */
  function initBackLink() {
    const back = document.getElementById('backLink');
    if (!back) return;
    back.addEventListener('click', (e) => {
      let ref = null;
      try { ref = document.referrer ? new URL(document.referrer) : null; } catch (err) { ref = null; }
      const fromIndex = ref &&
        ref.origin === location.origin &&
        /(\/|\/index\.html)$/.test(ref.pathname) &&
        history.length > 1;
      if (fromIndex) {
        e.preventDefault();
        history.back();
      }
    });
  }

  /* ── Utility functions ────────────────────── */
  function makeBtn(label, onClick) {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    return btn;
  }

  function makeSep() {
    const sep       = document.createElement('div');
    sep.className   = 'pill-sep';
    return sep;
  }

    function normTs(ts) {
      // Collapse to h:mm:ss or m:ss with non-padded leading unit
      const p = String(ts).trim().split(':').map(n => parseInt(n, 10));
      let h = 0, m = 0, s = 0;
      if (p.length === 3) { [h, m, s] = p; }
      else if (p.length === 2) { [m, s] = p; }
      else { s = p[0]; }
      m += Math.floor(s / 60); s %= 60;
      h += Math.floor(m / 60); m %= 60;
      return h > 0
        ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `${m}:${String(s).padStart(2,'0')}`;
    }
    function normKo(ko) {
      return String(ko).normalize('NFC').replace(/\s+/g, ' ').trim();
    }

  
  function tsToSeconds(ts) {
    const parts = ts.split(':').map(Number);
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    return parts[0] * 60;
  }

  function parseUserTime(raw) {
    const cleaned = raw.replace(/[^\d:]/g, '');
    if (!cleaned) return null;

    const parts = cleaned.split(':').filter(p => p !== '');
    if (parts.length === 0 || parts.length > 3) return null;
    if (parts.some(p => isNaN(Number(p)))) return null;

    const nums = parts.map(Number);
    if (nums.length === 1) return nums[0] * 60;
    if (nums.length === 2) return nums[0] * 60 + nums[1];
    return nums[0] * 3600 + nums[1] * 60 + nums[2];
  }

})();
