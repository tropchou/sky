<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hwasa Transcripts — Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #1a1a1a; text-decoration: none; }
    a:hover { color: #555; }

    /* ── Viewer Header ─────────────────────────── */
    .viewer-header {
      max-width: 740px;
      margin: 0 auto;
      padding: 40px 24px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }
    .viewer-header .back-link {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid #ccc;
      padding: 6px 16px;
      border-radius: 2px;
      transition: background 0.15s, border-color 0.15s;
    }
    .viewer-header .back-link:hover {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }
    .viewer-header .file-name {
      font-family: 'Source Serif 4', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: #555;
      word-break: break-all;
    }

    /* ── Viewer Content ────────────────────────── */
    .viewer-content {
      max-width: 740px;
      margin: 0 auto;
      padding: 36px 24px 100px;
    }
    .viewer-error {
      max-width: 740px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
    }
    .viewer-error h2 {
      font-family: 'Source Serif 4', serif;
      font-weight: 600;
      font-size: 1.4rem;
      margin-bottom: 12px;
    }
    .viewer-error p {
      color: #777;
      font-size: 0.95rem;
    }

    /* ── Header Block (source info before first timestamp) ── */
    .header-block {
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e8e8e8;
    }
    .header-block pre {
      font-family: 'Source Serif 4', serif;
      font-size: 0.92rem;
      line-height: 1.7;
      color: #888;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* ── Section Divider (— [MM:SS] ————) ────── */
    .section-divider {
      margin: 36px 0 24px;
      padding: 0;
      border: none;
      border-top: 1px solid #d0d0d0;
      position: relative;
    }
    .section-divider-label {
      position: absolute;
      top: -10px;
      left: 0;
      background: #fafafa;
      padding-right: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      color: #999;
      letter-spacing: 0.04em;
    }

    /* ── Sentence Unit ─────────────────────────── */
    .sentence-unit {
      margin-bottom: 20px;
      padding: 12px 0;
      transition: background 0.15s;
    }

    /* ── Timestamp Row ─────────────────────────── */
    .ts-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .ts-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: #999;
      letter-spacing: 0.03em;
      min-width: 42px;
    }
    .study-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 2px;
      background: #fff;
      color: #999;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      line-height: 1.3;
    }
    .study-btn:hover {
      border-color: #1a1a1a;
      color: #1a1a1a;
    }
    .study-btn.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }
    .study-btn.unavailable {
      color: #ccc;
      border-color: #e8e8e8;
      cursor: default;
    }
    .study-btn.unavailable:hover {
      color: #ccc;
      border-color: #e8e8e8;
    }

    /* ── Language Lines ─────────────────────────── */
    .lang-line {
      font-family: 'Source Serif 4', serif;
      font-size: 1.05rem;
      line-height: 1.85;
      color: #1a1a1a;
      padding: 0;
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 2px;
    }
    .lang-line .lang-tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #b0b0b0;
      margin-right: 6px;
      display: inline-block;
      min-width: 24px;
    }
    .lang-line.ko .lang-tag { color: #7a9bb5; }
    .lang-line.fr .lang-tag { color: #b59a7a; }
    .lang-line.en .lang-tag { color: #8fb57a; }

    /* Highlight state */
    .sentence-unit.highlighted .lang-line {
      background: rgba(26, 26, 26, 0.04);
    }
    .sentence-unit.highlighted .lang-line.ko {
      background: rgba(122, 155, 181, 0.08);
    }
    .sentence-unit.highlighted .lang-line.fr {
      background: rgba(181, 154, 122, 0.08);
    }
    .sentence-unit.highlighted .lang-line.en {
      background: rgba(143, 181, 122, 0.08);
    }

    /* ── Expandable Panels ─────────────────────── */
    .study-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      opacity: 0;
    }
    .study-panel.open {
      opacity: 1;
      max-height: 2000px; /* large enough; actual height is auto */
    }
    .study-panel-inner {
      margin-top: 10px;
      padding: 16px 18px;
      border: 1px solid #e4e4e4;
      border-radius: 4px;
      background: #fff;
      max-height: 50vh;
      overflow-y: auto;
    }

    /* Word Breakdown Table */
    .word-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .word-table th {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #999;
      text-align: left;
      padding: 6px 10px 8px;
      border-bottom: 1px solid #e8e8e8;
    }
    .word-table td {
      font-family: 'Source Serif 4', serif;
      font-size: 0.88rem;
      padding: 8px 10px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: top;
      line-height: 1.5;
    }
    .word-table tr:last-child td { border-bottom: none; }
    .word-table .term-cell {
      font-weight: 600;
      white-space: nowrap;
      color: #1a1a1a;
    }
    .word-table .root-cell {
      color: #555;
    }
    .word-table .notes-cell {
      color: #666;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
    }
    .word-table .pos-badge {
      display: inline-block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #f2f2f2;
      color: #888;
      padding: 2px 6px;
      border-radius: 2px;
      margin-bottom: 3px;
    }

    /* Grammar Points List */
    .grammar-list {
      list-style: none;
      padding: 0;
    }
    .grammar-list li {
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.88rem;
    }
    .grammar-list li:last-child { border-bottom: none; }
    .grammar-pattern {
      font-family: 'Source Serif 4', serif;
      font-weight: 600;
      color: #1a1a1a;
      display: block;
      margin-bottom: 2px;
    }
    .grammar-meaning {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.84rem;
      color: #555;
      display: block;
      margin-bottom: 2px;
    }
    .grammar-example {
      font-family: 'Source Serif 4', serif;
      font-size: 0.82rem;
      color: #888;
      font-style: italic;
    }
    .grammar-level {
      display: inline-block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .grammar-level.beginner { background: #e8f5e9; color: #4a8c5c; }
    .grammar-level.intermediate { background: #fff3e0; color: #b5854a; }
    .grammar-level.advanced { background: #fce4ec; color: #b55a6a; }

    /* Panel section titles */
    .panel-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 10px;
    }

    /* ── Navigation Pill ───────────────────────── */
    .nav-pill {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0;
      background: rgba(26, 26, 26, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 4px 6px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .nav-pill.visible {
      opacity: 1;
      visibility: visible;
    }
    .nav-pill button {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: #ccc;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 30px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }
    .nav-pill button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .nav-pill button:disabled {
      color: #555;
      cursor: default;
      background: none;
    }
    .nav-pill .pill-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    /* ── Timestamp input ───────────────────────── */
    .ts-wrapper {
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .ts-input-container {
      display: flex;
      align-items: center;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-width 0.25s ease, opacity 0.2s ease;
    }
    .ts-input-container.open {
      max-width: 140px;
      opacity: 1;
    }
    .ts-input {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      width: 60px;
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      outline: none;
      margin-left: 4px;
      line-height: 1;
    }
    .ts-input::placeholder {
      color: #777;
      font-size: 0.72rem;
    }
    .ts-input:focus {
      border-color: rgba(255, 255, 255, 0.4);
    }
    .ts-input.error {
      border-color: #e05050;
    }
    .ts-go-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: #ccc;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 4px;
      margin-left: 3px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }
    .ts-go-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }

    /* ── Mobile ─────────────────────────────────── */
    @media (max-width: 640px) {
      .viewer-header { padding: 28px 20px 16px; }
      .viewer-header .file-name { font-size: 0.95rem; }
      .viewer-content { padding: 28px 20px 100px; }
      .lang-line { font-size: 0.98rem; line-height: 1.75; }
      .nav-pill {
        bottom: 14px;
        padding: 3px 4px;
      }
      .nav-pill button {
        padding: 10px 11px;
        font-size: 0.74rem;
      }
      .word-table th,
      .word-table td { padding: 6px; font-size: 0.82rem; }
      .word-table .notes-cell { font-size: 0.78rem; }
      .study-panel-inner { padding: 12px 14px; }

      /* Stack word table on narrow screens */
      .word-table, .word-table thead, .word-table tbody,
      .word-table th, .word-table tr, .word-table td {
        display: block;
      }
      .word-table thead { display: none; }
      .word-table tr {
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #f0f0f0;
      }
      .word-table tr:last-child { margin-bottom: 0; border-bottom: none; }
      .word-table td {
        padding: 2px 0;
        border-bottom: none;
      }
      .word-table td::before {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #b0b0b0;
        display: block;
        margin-bottom: 1px;
      }
      .word-table .term-cell::before { content: 'Term'; }
      .word-table .root-cell::before { content: 'Root'; }
      .word-table .breakdown-cell::before { content: 'Breakdown'; }
      .word-table .notes-cell::before { content: 'Notes'; }
    }
  </style>
</head>
<body>
  <div class="viewer-header">
    <a href="index.html" class="back-link">← Back</a>
    <span class="file-name" id="fileName"></span>
  </div>

  <div class="viewer-content" id="viewerContent" style="display:none;">
    <div id="transcriptContainer"></div>
  </div>

  <div class="viewer-error" id="viewerError" style="display:none;">
    <h2>File not found</h2>
    <p>The requested file could not be loaded.</p>
    <p style="margin-top: 16px;">
      <a href="index.html" style="text-decoration: underline;">Return to index</a>
    </p>
  </div>

  <!-- Navigation Pill -->
  <div class="nav-pill" id="navPill"></div>

  <script>
  (function () {
    const params      = new URLSearchParams(window.location.search);
    const file        = params.get('file');
    const nameEl      = document.getElementById('fileName');
    const container   = document.getElementById('transcriptContainer');
    const contentWrap = document.getElementById('viewerContent');
    const errorWrap   = document.getElementById('viewerError');
    const pill        = document.getElementById('navPill');

    if (!file) {
      nameEl.textContent = 'No file specified';
      errorWrap.style.display = 'block';
      return;
    }

    const segments    = file.split('/');
    const displayName = segments[segments.length - 1];
    nameEl.textContent = displayName;
    document.title = `${displayName} — Hwasa Transcripts`;

    /* ── Derive grammar file path ─────────────── */
    const grammarFile = file.replace(/\.txt$/i, '-grammar.json');

    /* ── Fetch transcript + grammar in parallel ── */
    const transcriptPromise = fetch(file).then(r => {
      if (!r.ok) throw new Error('Not found');
      return r.text();
    });

    const grammarPromise = fetch(grammarFile)
      .then(r => {
        if (!r.ok) return null;
        return r.json();
      })
      .catch(() => null);

    Promise.all([transcriptPromise, grammarPromise])
      .then(([text, grammarData]) => {
        contentWrap.style.display = 'block';
        const parsed = parseTranscript(text);
        renderTranscript(parsed, grammarData);
        initNavPill(parsed);
      })
      .catch(() => {
        errorWrap.style.display = 'block';
      });

    /* ══════════════════════════════════════════════
       PARSER
       ══════════════════════════════════════════════ */

    /**
     * Parses the transcript text into a structured object:
     * {
     *   header: string|null,         // text before first timestamp
     *   sections: [                   // divided by — [MM:SS] ———— lines
     *     {
     *       dividerTs: string|null,   // e.g. "00:00" from divider line
     *       sentences: [
     *         {
     *           ts: string,           // "00:07"
     *           seconds: number,
     *           ko: string,
     *           fr: string,
     *           en: string
     *         }
     *       ]
     *     }
     *   ]
     * }
     */
    function parseTranscript(text) {
      const lines = text.split('\n');
      const result = { header: null, sections: [] };

      let headerLines   = [];
      let inHeader       = true; // before any timestamp or divider
      let currentSection = { dividerTs: null, sentences: [] };
      let currentSentence = null;
      let lastLang       = null; // 'ko' | 'fr' | 'en'

      const DIVIDER_RE   = /^—\s*\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*—+$/;
      const TIMESTAMP_RE = /^\[(\d{1,2}:\d{2}(?::\d{2})?)\]$/;
      const KO_RE        = /^KO:\s*(.*)$/;
      const FR_RE        = /^FR:\s*(.*)$/;
      const EN_RE        = /^EN:\s*(.*)$/;

      function flushSentence() {
        if (currentSentence && currentSentence.ko) {
          currentSentence.ko = currentSentence.ko.trim();
          currentSentence.fr = (currentSentence.fr || '').trim();
          currentSentence.en = (currentSentence.en || '').trim();
          currentSection.sentences.push(currentSentence);
        }
        currentSentence = null;
        lastLang = null;
      }

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        const stripped = line.trim();

        // ── Divider line: — [MM:SS] ———— ──
        const divM = stripped.match(DIVIDER_RE);
        if (divM) {
          if (inHeader) {
            inHeader = false;
            result.header = headerLines.join('\n').trim() || null;
          }
          flushSentence();
          // Push previous section if it has content
          if (currentSection.sentences.length > 0 || result.sections.length === 0) {
            result.sections.push(currentSection);
          }
          currentSection = { dividerTs: divM[1], sentences: [] };
          continue;
        }

        // ── Standalone timestamp: [MM:SS] ──
        const tsM = stripped.match(TIMESTAMP_RE);
        if (tsM) {
          if (inHeader) {
            inHeader = false;
            result.header = headerLines.join('\n').trim() || null;
          }
          flushSentence();
          currentSentence = {
            ts: tsM[1],
            seconds: tsToSeconds(tsM[1]),
            ko: '', fr: '', en: ''
          };
          continue;
        }

        // ── KO: line ──
        const koM = stripped.match(KO_RE);
        if (koM) {
          if (inHeader) {
            inHeader = false;
            result.header = headerLines.join('\n').trim() || null;
          }
          // If no currentSentence (Format A: KO without preceding [MM:SS])
          if (!currentSentence) {
            currentSentence = {
              ts: null,
              seconds: 0,
              ko: '', fr: '', en: ''
            };
          }
          // If this sentence already has KO, flush and start new
          if (currentSentence.ko) {
            const prevTs = currentSentence.ts;
            const prevSec = currentSentence.seconds;
            flushSentence();
            currentSentence = {
              ts: prevTs, seconds: prevSec,
              ko: '', fr: '', en: ''
            };
          }
          currentSentence.ko = koM[1];
          lastLang = 'ko';
          continue;
        }

        // ── FR: line ──
        const frM = stripped.match(FR_RE);
        if (frM) {
          if (currentSentence) {
            currentSentence.fr = frM[1];
            lastLang = 'fr';
          }
          continue;
        }

        // ── EN: line ──
        const enM = stripped.match(EN_RE);
        if (enM) {
          if (currentSentence) {
            currentSentence.en = enM[1];
            lastLang = 'en';
          }
          continue;
        }

        // ── Header accumulation ──
        if (inHeader) {
          headerLines.push(line);
          continue;
        }

        // ── Continuation line (wrapping FR/EN text) ──
        if (stripped && lastLang && currentSentence) {
          if (lastLang === 'ko') currentSentence.ko += ' ' + stripped;
          else if (lastLang === 'fr') currentSentence.fr += ' ' + stripped;
          else if (lastLang === 'en') currentSentence.en += ' ' + stripped;
          continue;
        }

        // ── Blank line resets continuation ──
        if (!stripped) {
          lastLang = null;
        }
      }

      // Flush remaining
      flushSentence();
      if (currentSection.sentences.length > 0) {
        result.sections.push(currentSection);
      }

      return result;
    }

    /* ══════════════════════════════════════════════
       RENDERER
       ══════════════════════════════════════════════ */

    function renderTranscript(parsed, grammarData) {
      // ── Build grammar lookup: index → grammar object ──
      const grammarLookup = buildGrammarLookup(grammarData);

      let sentenceIndex = 0; // global running index across all sections

      // ── Header ──
      if (parsed.header) {
        const headerDiv = document.createElement('div');
        headerDiv.className = 'header-block';
        const pre = document.createElement('pre');
        pre.textContent = parsed.header;
        headerDiv.appendChild(pre);
        container.appendChild(headerDiv);
      }

      // ── Sections ──
      parsed.sections.forEach((section) => {
        // Section divider
        if (section.dividerTs) {
          const divider = document.createElement('hr');
          divider.className = 'section-divider';
          const label = document.createElement('span');
          label.className = 'section-divider-label';
          label.textContent = section.dividerTs;
          const wrapper = document.createElement('div');
          wrapper.style.position = 'relative';
          wrapper.appendChild(divider);
          wrapper.appendChild(label);
          container.appendChild(wrapper);
        }

        // Sentences
        section.sentences.forEach((sent) => {
          const grammar = grammarLookup ? grammarLookup[sentenceIndex] : null;
