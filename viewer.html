<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hwasa Transcripts — Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: #1a1a1a; text-decoration: none; }
  a:hover { color: #555; }

  .viewer-header {
    max-width: 740px;
    margin: 0 auto;
    padding: 40px 24px 20px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }

  .viewer-header .back-link {
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: 1px solid #ccc;
    padding: 6px 16px;
    border-radius: 2px;
    transition: background 0.15s, border-color 0.15s;
  }

  .viewer-header .back-link:hover {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
  }

  .viewer-header .file-name {
    font-family: 'Source Serif 4', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: #555;
    word-break: break-all;
  }

  .viewer-content {
    max-width: 740px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }

  .viewer-content pre {
    font-family: 'Source Serif 4', serif;
    font-size: 1.05rem;
    line-height: 1.85;
    color: #1a1a1a;
    white-space: pre-wrap;
    word-wrap: break-word;
    background: none;
  }

  .viewer-error {
    max-width: 740px;
    margin: 60px auto;
    padding: 0 24px;
    text-align: center;
  }

  .viewer-error h2 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.4rem;
    margin-bottom: 12px;
  }

  .viewer-error p {
    color: #777;
    font-size: 0.95rem;
  }

  @media (max-width: 640px) {
    .viewer-header { padding: 28px 20px 16px; }
    .viewer-header .file-name { font-size: 0.95rem; }
    .viewer-content { padding: 28px 20px 60px; }
    .viewer-content pre { font-size: 0.98rem; line-height: 1.75; }
  }
</style>
</head>
<body>

<div class="viewer-header">
  <a href="index.html" class="back-link">← Back</a>
  <span class="file-name" id="fileName"></span>
</div>

<div class="viewer-content" id="viewerContent" style="display:none;">
  <pre id="fileContent"></pre>
</div>

<div class="viewer-error" id="viewerError" style="display:none;">
  <h2>File not found</h2>
  <p>The requested file could not be loaded.</p>
  <p style="margin-top: 16px;"><a href="index.html" style="text-decoration: underline;">Return to index</a></p>
</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');
  const nameEl = document.getElementById('fileName');
  const contentEl = document.getElementById('fileContent');
  const contentWrap = document.getElementById('viewerContent');
  const errorWrap = document.getElementById('viewerError');

  if (!file) {
    nameEl.textContent = 'No file specified';
    errorWrap.style.display = 'block';
    return;
  }

  const segments = file.split('/');
  const displayName = segments[segments.length - 1];
  nameEl.textContent = displayName;
  document.title = `${displayName} — Hwasa Transcripts`;

  fetch(file)
    .then(r => {
      if (!r.ok) throw new Error('Not found');
      return r.text();
    })
    .then(text => {
      contentEl.textContent = text;
      contentWrap.style.display = 'block';
    })
    .catch(() => {
      errorWrap.style.display = 'block';
    });
})();
</script>

</body>
</html>
