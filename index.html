<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hwasa Transcripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap"
  rel="stylesheet">
<style>
  /* ── Reset & Base ─────────────────────────────── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: #1a1a1a; text-decoration: none; }
  a:hover { color: #555; }

  /* ── Header ───────────────────────────────────── */
  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 24px 20px;
    border-bottom: 1px solid #e0e0e0;
  }

  header h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 2.4rem;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  header p.subtitle {
    font-size: 0.95rem;
    color: #777;
    font-weight: 400;
  }

  /* ── Filter Bar ───────────────────────────────── */
  .filter-bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .filter-toggle {
    display: none;
    width: 100%;
    padding: 14px 0;
    background: none;
    border: none;
    border-bottom: 1px solid #e0e0e0;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: #1a1a1a;
    cursor: pointer;
    text-align: left;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .filter-toggle::after { content: ' ▾'; }
  .filter-toggle.open::after { content: ' ▴'; }

  .filter-options {
    display: flex;
    gap: 8px;
    padding: 18px 0;
    border-bottom: 1px solid #e0e0e0;
    flex-wrap: wrap;
  }

  .filter-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 8px 18px;
    border: 1px solid #ccc;
    border-radius: 2px;
    background: #fff;
    color: #1a1a1a;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .filter-btn:hover { border-color: #1a1a1a; }

  .filter-btn.active {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
  }

  /* ── Sort Bar ─────────────────────────────── */
  .sort-bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .sort-toggle {
    display: none;          /* same mobile-only pattern as filter-toggle */
  }
  
  @media (max-width: 640px) {
    .sort-bar { padding: 0 20px; }
    .sort-toggle { display: block; }
    .sort-options {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 12px 0 16px;
    }
    .sort-options.open { display: flex; }
  }


  /* ── Main Content ─────────────────────────────── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .era-section { margin-top: 50px; }

  .era-section h2 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.6rem;
    letter-spacing: -0.01em;
    margin-bottom: 28px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e0e0e0;
  }

  .entries-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 32px;
  }

  /* ── Entry Card ───────────────────────────────── */
  .entry-card {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 3px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .entry-card:hover {
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  }

  .entry-card .thumb {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #ededed;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .entry-card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .entry-card .thumb .placeholder {
    font-family: 'Source Serif 4', serif;
    font-size: 0.9rem;
    color: #aaa;
    font-style: italic;
    text-transform: capitalize;
  }

  .entry-card .card-body { padding: 18px 20px 22px; }

  .entry-card .card-date {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 4px;
  }

  .entry-card .card-desc {
    font-family: 'Source Serif 4', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 12px;
    line-height: 1.35;
  }

  .entry-card .card-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .entry-card .card-links a {
    font-size: 0.8rem;
    font-weight: 500;
    padding: 5px 12px;
    border: 1px solid #ddd;
    border-radius: 2px;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .entry-card .card-links a:hover {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
  }

  .entry-card .card-links a.link-transcript { border-color: #1a1a1a; }
  .entry-card .card-links a.link-vocab { border-color: #b0b0b0; }
  .entry-card .card-links a.link-quiz { border-color: #b0b0b0; }
  .entry-card .card-links a.link-grammar { border-color: #b0b0b0; }

  /* ── Hidden entries (year filter) ─────────────── */
  .entry-card.hidden { display: none; }
  .era-section.hidden { display: none; }

  /* ── Mobile ───────────────────────────────────── */
  @media (max-width: 640px) {
    header { padding: 40px 20px 16px; }
    header h1 { font-size: 1.8rem; }

    .filter-bar { padding: 0 20px; }

    .filter-toggle { display: block; }

    .filter-options {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 12px 0 16px;
    }

    .filter-options.open { display: flex; }

    .filter-btn {
      width: 100%;
      text-align: center;
      padding: 12px 18px;
      font-size: 0.85rem;
    }

    main { padding: 0 20px 60px; }

    .era-section { margin-top: 36px; }
    .era-section h2 { font-size: 1.3rem; margin-bottom: 20px; }

    .entries-grid {
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .entry-card .thumb { aspect-ratio: 4 / 3; }
  }
</style>
</head>
<body>

<header>
  <h1>Hwasa Transcripts</h1>
  <p class="subtitle">Korean study transcripts, vocabulary &amp; quizzes</p>
</header>

<div class="filter-bar">
  <button class="filter-toggle" aria-expanded="false" onclick="toggleFilter()">Filter by Year</button>
  <div class="filter-options" id="filterOptions">
    <button class="filter-btn active" data-year="all" onclick="filterYear('all', this)">All</button>
    <button class="filter-btn" data-year="2024" onclick="filterYear('2024', this)">2024</button>
    <button class="filter-btn" data-year="2025" onclick="filterYear('2025', this)">2025</button>
    <button class="filter-btn" data-year="2026" onclick="filterYear('2026', this)">2026</button>
    <button class="filter-btn" data-year="2027" onclick="filterYear('2027', this)">2027</button>
  </div>
</div>

<div class="sort-bar">
  <button class="filter-toggle sort-toggle" aria-expanded="false"
          onclick="toggleSort()">Sort By</button>
  <div class="filter-options sort-options" id="sortOptions">
    <button class="filter-btn active" data-sort="date-desc"
            onclick="sortEntries('date-desc', this)">Date (Newest)</button>
    <button class="filter-btn" data-sort="date-asc"
            onclick="sortEntries('date-asc', this)">Date (Oldest)</button>
    <button class="filter-btn" data-sort="era"
            onclick="sortEntries('era', this)">Era</button>
  </div>
</div>


<main>

  <section class="era-section" data-era-name="socute">
    <h2>So Cute</h2>
    <div class="entries-grid">
      <div class="entry" data-year="2026" data-era="socute" data-date="260514" data-desc="davichi"></div>
      <div class="entry" data-year="2026" data-era="socute" data-date="260418" data-desc="mintboxFancam"></div>
      <div class="entry" data-year="2026" data-era="socute" data-date="260415" data-desc="wendyyoungstreet"></div>
      <div class="entry" data-year="2026" data-era="socute" data-date="260414" data-desc="MBCRadio"></div>
      <div class="entry" data-year="2026" data-era="socute" data-date="260412" data-desc="mintboxFansign"></div>
    </div>
  </section>

  <section class="era-section" data-era-name="ggb">
    <h2>Good Goodbye</h2>
    <div class="entries-grid">
      <div class="entry" data-year="2025" data-era="ggb" data-date="260110" data-desc="SGmintboxFancam"></div>
      <div class="entry" data-year="2025" data-era="ggb" data-date="251023" data-desc="kiss-the-radio"></div>
    </div>
  </section>

  <section class="era-section" data-era-name="bstage">
    <h2>B-Stage</h2>
    <div class="entries-grid">
      <div class="entry" data-year="2026" data-era="bstage" data-date="260428"></div>
      <div class="entry" data-year="2026" data-era="bstage" data-date="260426"></div>
      <div class="entry" data-year="2026" data-era="bstage" data-date="260412"></div>
      <div class="entry" data-year="2026" data-era="bstage" data-date="260311"></div>
      <div class="entry" data-year="2026" data-era="bstage" data-date="260302"></div>
      <div class="entry" data-year="2026" data-era="bstage" data-date="260225"></div>
      <div class="entry" data-year="2026" data-era="bstage" data-date="260125"></div>
    </div>
  </section>

</main>

<script>
(function () {
  /* ── Config ───────────────────────────────── */
  const BASE_TRANSCRIPT = 'transcripts';
  const BASE_IMAGE      = 'images';
  const MAX_PROBE       = 20;

  /* ── Helpers ──────────────────────────────── */
  function formatDate(yymmdd) {
    const yy = parseInt(yymmdd.substring(0, 2), 10);
    const mm = parseInt(yymmdd.substring(2, 4), 10) - 1;
    const dd = parseInt(yymmdd.substring(4, 6), 10);
    const d  = new Date(2000 + yy, mm, dd);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function fileExists(url) {
    return fetch(url, { method: 'HEAD' })
      .then(r => r.ok)
      .catch(() => false);
  }

  function stem(era, date, desc) {
    let s = `hwasa-${era}-${date}`;
    if (desc) s += `-${desc}`;
    return s;
  }

  function formatDesc(slug) {
    let s = slug.replace(/([a-z])([A-Z])/g, '$1 $2');
    s = s.replace(/-/g, ' ');
    return s.replace(/\b\w/g, c => c.toUpperCase());
  }

  const ERA_LABELS = {
    ggb:    'Good Goodbye',
    socute: 'So Cute',
    bstage: 'B-Stage'
  };

  const ERA_ORDER = {
  socute:  1,
  bstage:  2,
  ggb:     3
  // future eras: tbd: 4, ...
  };


  async function findImage(era, date, desc) {
    const s        = stem(era, date, desc);
    const fallback = `${BASE_IMAGE}/${era}/${era}-default`;
    const candidates = [
      `${BASE_IMAGE}/${era}/${s}.jpg`,
      `${BASE_IMAGE}/${era}/${s}.png`,
      `${fallback}.jpg`,
      `${fallback}.png`
    ];
    for (const path of candidates) {
      if (await fileExists(path)) return path;
    }
    return null;
  }

  async function discoverFiles(era, date, desc, prefix) {
    const found = [];
    const s = stem(era, date, desc);
    for (let i = 1; i <= MAX_PROBE; i++) {
      const name = `${s}-${prefix}${pad(i)}.txt`;
      const path = `${BASE_TRANSCRIPT}/${era}/${name}`;
      if (await fileExists(path)) {
        found.push({ label: `${prefix} ${pad(i)}`, path: path });
      } else {
        break;
      }
    }
    return found;
  }

  /* ── Build Card ───────────────────────────── */
  async function buildCard(entry) {
    const year = entry.dataset.year;
    const era  = entry.dataset.era;
    const date = entry.dataset.date;
    const desc = entry.dataset.desc || '';

    const s              = stem(era, date, desc);
    const transcriptFile = `${BASE_TRANSCRIPT}/${era}/${s}.txt`;
    const grammarFile    = `${BASE_TRANSCRIPT}/${era}/${s}-grammar.txt`;

    const hasTranscript = await fileExists(transcriptFile);
    const hasGrammar    = await fileExists(grammarFile);
    const vocabs        = await discoverFiles(era, date, desc, 'vocab');
    const quizzes       = await discoverFiles(era, date, desc, 'quiz');
    const imgSrc        = await findImage(era, date, desc);

    // Build card
    const card       = document.createElement('div');
    card.className   = 'entry-card';
    card.dataset.year = year;
    card.dataset.date = date;
    card.dataset.era  = era;
    
    // Thumbnail
    const thumb     = document.createElement('div');
    thumb.className = 'thumb';
    if (imgSrc) {
      const img   = document.createElement('img');
      img.src     = imgSrc;
      img.alt     = `Hwasa – ${ERA_LABELS[era] || era}` + (desc ? ` – ${formatDesc(desc)}` : '') + ` – ${formatDate(date)}`;
      img.loading = 'lazy';
      thumb.appendChild(img);
    } else {
      const ph       = document.createElement('span');
      ph.className   = 'placeholder';
      ph.textContent = ERA_LABELS[era] || era;
      thumb.appendChild(ph);
    }
    card.appendChild(thumb);

    // Card body
    const body       = document.createElement('div');
    body.className   = 'card-body';

    const dateEl       = document.createElement('div');
    dateEl.className   = 'card-date';
    dateEl.textContent = formatDate(date);
    body.appendChild(dateEl);

    if (desc) {
      const descEl       = document.createElement('div');
      descEl.className   = 'card-desc';
      descEl.textContent = formatDesc(desc);
      body.appendChild(descEl);
    }

    const links     = document.createElement('div');
    links.className = 'card-links';

    if (hasTranscript) {
      const a       = document.createElement('a');
      a.href        = `viewer.html?file=${encodeURIComponent(transcriptFile)}`;
      a.textContent = 'Transcript';
      a.className   = 'link-transcript';
      links.appendChild(a);
    }

    if (hasGrammar) {
      const a       = document.createElement('a');
      a.href        = `viewer.html?file=${encodeURIComponent(transcriptFile)}&grammar=1`;
      a.textContent = 'Grammar';
      a.className   = 'link-grammar';
      links.appendChild(a);
    }

    vocabs.forEach(v => {
      const a       = document.createElement('a');
      a.href        = `viewer.html?file=${encodeURIComponent(v.path)}`;
      a.textContent = v.label;
      a.className   = 'link-vocab';
      links.appendChild(a);
    });

    quizzes.forEach(q => {
      const a       = document.createElement('a');
      a.href        = `viewer.html?file=${encodeURIComponent(q.path)}`;
      a.textContent = q.label;
      a.className   = 'link-quiz';
      links.appendChild(a);
    });

    body.appendChild(links);
    card.appendChild(body);

    entry.replaceWith(card);
  }

  /* ── Init ──────────────────────────────────── */
  const entries = document.querySelectorAll('.entry');
  entries.forEach(e => buildCard(e));
})();

/* ── Year Filter ────────────────────────────── */
function filterYear(year, btn) {
  document.querySelectorAll('.filter-btn[data-year]').forEach(b =>
    b.classList.remove('active'));
  btn.classList.add('active');

  document.querySelectorAll('.entry-card').forEach(card => {
    card.classList.toggle('hidden',
      year !== 'all' && card.dataset.year !== year);
  });

  // Only show/hide era sections when in era sort mode
  if (currentSort === 'era') {
    document.querySelectorAll('.era-section').forEach(section => {
      const visible = section.querySelectorAll('.entry-card:not(.hidden)');
      section.classList.toggle('hidden', visible.length === 0);
    });
  }
}


/* ── Mobile Filter Toggle ───────────────────── */
function toggleFilter() {
  const btn    = document.querySelector('.filter-toggle');
  const opts   = document.getElementById('filterOptions');
  const isOpen = opts.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  btn.setAttribute('aria-expanded', isOpen);
}

/* ── Sort ────────────────────────────────────── */
let currentSort = 'date-desc';  // default

function sortEntries(mode, btn) {
  // Update active button
  document.querySelectorAll('.sort-bar .filter-btn').forEach(b =>
    b.classList.remove('active'));
  btn.classList.add('active');
  currentSort = mode;

  const main = document.querySelector('main');

  if (mode === 'era') {
    // ── Sort by Era: restore the original section-based layout ──
    const sections = [...document.querySelectorAll('.era-section')];
    sections.sort((a, b) =>
      (ERA_ORDER[a.dataset.eraName] || 999) - (ERA_ORDER[b.dataset.eraName] || 999)
    );
    sections.forEach(sec => {
      sec.classList.remove('hidden');
      sec.style.display = '';               // make sure it's visible
      // Sort cards within each era section by date descending
      const grid = sec.querySelector('.entries-grid');
      const cards = [...grid.querySelectorAll('.entry-card')];
      cards.sort((a, b) => {
        const dA = a.dataset.date || '000000';
        const dB = b.dataset.date || '000000';
        return dB.localeCompare(dA);        // newest first within era
      });
      cards.forEach(c => grid.appendChild(c));
      main.appendChild(sec);                // re-order sections in DOM
    });
  } else {
    // ── Sort by Date: flatten all cards into one list ──
    const allCards = [...document.querySelectorAll('.entry-card')];

    allCards.sort((a, b) => {
      const dA = a.dataset.date || '000000';
      const dB = b.dataset.date || '000000';
      return mode === 'date-asc'
        ? dA.localeCompare(dB)
        : dB.localeCompare(dA);
    });

    // Hide era section headers — they don't apply in flat date sort
    document.querySelectorAll('.era-section h2').forEach(h =>
      h.style.display = 'none');

    // Move all cards into first section's grid (or a single flat container)
    const flatGrid =
      document.querySelector('.era-section .entries-grid');
    allCards.forEach(c => flatGrid.appendChild(c));

    // Hide empty sections, show the one with cards
    document.querySelectorAll('.era-section').forEach(sec => {
      const hasCards = sec.querySelectorAll('.entry-card').length > 0;
      sec.style.display = hasCards ? '' : 'none';
      if (hasCards) sec.querySelector('h2').style.display = 'none';
    });
  }

  // Re-apply the active year filter after sorting
  const activeYear =
    document.querySelector('.filter-btn.active[data-year]');
  if (activeYear) {
    filterYear(activeYear.dataset.year, activeYear);
  }
}

/* ── Mobile Sort Toggle ─────────────────────── */
function toggleSort() {
  const btn  = document.querySelector('.sort-toggle');
  const opts = document.getElementById('sortOptions');
  const isOpen = opts.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  btn.setAttribute('aria-expanded', isOpen);
}

  
</script>
</body>
</html>
